apiVersion: v1
kind: Service
metadata:
  name: __PROXY_NAME__
spec:
  selector:
    app: __PROXY_NAME__
  ports:
    - name: f1c-sctp
      protocol: SCTP
      port: __F1C_PORT__
      targetPort: __F1C_PORT__
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __PROXY_NAME__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __PROXY_NAME__
  template:
    metadata:
      labels:
        app: __PROXY_NAME__
    spec:
      containers:
        - name: proxy
          image: docker.io/genechen0203/f1ap-sctp-proxy:latest
          imagePullPolicy: Always
          env:
            - name: CU_HOST
              value: "__CU_HOST__"
            - name: CU_PORT
              value: "__F1C_PORT__"
            - name: LISTEN_PORT
              value: "__F1C_PORT__"
            - name: OTEL_SERVICE_NAME
              value: "__PROXY_NAME__"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "__OTEL_ENDPOINT__"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "__OTEL_INSECURE__"
          ports:
            - containerPort: __F1C_PORT__
              protocol: SCTP
          securityContext:
            privileged: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        deplocation: __RAN_LOC__
