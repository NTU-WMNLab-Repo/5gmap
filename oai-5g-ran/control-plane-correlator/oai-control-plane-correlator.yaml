apiVersion: v1
kind: Service
metadata:
  name: control-plane-correlator
  labels:
    app: control-plane-correlator
spec:
  selector:
    app: control-plane-correlator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-correlator
  labels:
    app: control-plane-correlator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane-correlator
  template:
    metadata:
      labels:
        app: control-plane-correlator
    spec:
      containers:
        - name: correlator
          image: docker.io/genechen0203/control-plane-correlator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: ONLINE_CORRELATOR_HOST
              value: 0.0.0.0
            - name: ONLINE_CORRELATOR_PORT
              value: "8080"
            - name: ONLINE_CORRELATION_INITIAL_GAP_MS
              value: "1000"
            - name: ONLINE_CORRELATION_RELEASE_GAP_MS
              value: "5000"
            - name: ONLINE_CORRELATION_IDLE_TIMEOUT_MS
              value: "60000"
            - name: ONLINE_CORRELATION_MAX_LIFECYCLES
              value: "10000"
