kubernetesType: Vanilla  #Vanilla for community kubernetes distribution

nfimage:
  repository: docker.io/oaisoftwarealliance/oai-nr-ue           # dockehub oaisoftwarealliance/oai-nr-ue
  version: develop # image tag    # develop tag experimental features 
  # pullPolicy: IfNotPresent or Never or Always
  pullPolicy: IfNotPresent

tcpdumpimage:
  repository: docker.io/corfr/tcpdump
  version: latest
  #pullPolicy: IfNotPresent or Never or Always
  pullPolicy: IfNotPresent

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "oai-nr-ue10-sa"

## good to use when pulling images from docker-hub mention 
#imagePullSecrets: 
#  - name: "regcred"


podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

securityContext:
  privileged: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

start:
  nrue: true
  tcpdump: false  # if false then started in sleep mode else it will start capturing packets, nr ue will have a lot of packets per sec better avoid this or add a filter in the deployment.yaml

multus:
  create: false
  ipadd: "172.21.6.204"  # interface needed to connect with gnb
  netmask: "22"
  defaultGateway: "172.21.7.254"
  hostInterface: "bond0"

config:
  timeZone: "Europe/Paris"
  rfSimulator: "oai-gnb-du10"
  sdrAddrs: "oai-gnb-du10"
  fullImsi: "208950000000010"
  fullKey: "0C0A34601D4F07677303652C04625310"
  opc: "63bfa50ee6523365ff14c1f45f88737d"
  dnn: "oai"
  nssaiSst: "210"
  nssaiSd: "123"
  useAdditionalOptions: "-E --sa --rfsim --rfsimulator.serveraddr oai-gnb-du10 -r 106 --numerology 1 -C 3619200000 --nokrnmod" 

# in case of du change the command   
#"--sa --rfsim -r 106 --numerology 1 -C 3619200000 --nokrnmod --log_config.global_log_options level,nocolor,time" 

resources:
  define: false
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
   cpu: 100m
   memory: 256Mi

terminationGracePeriodSeconds: 5

nodeSelector:
  deplocation: az

nodeName: 
