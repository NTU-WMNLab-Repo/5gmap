apiVersion: v1
kind: Service
metadata:
  name: f1ap-sctp-proxy
spec:
  selector:
    app: f1ap-sctp-proxy
  ports:
    - name: f1c-sctp
      protocol: SCTP
      port: 38472
      targetPort: 38472
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1ap-sctp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f1ap-sctp-proxy
  template:
    metadata:
      labels:
        app: f1ap-sctp-proxy
    spec:
      containers:
        - name: proxy
          image: f1ap-sctp-proxy:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CU_HOST
              value: "oai-cu"
            - name: CU_PORT
              value: "38472"
            - name: OTEL_SERVICE_NAME
              value: "f1ap-sctp-proxy"
          ports:
            - containerPort: 38472
              protocol: SCTP
          securityContext:
            privileged: true

