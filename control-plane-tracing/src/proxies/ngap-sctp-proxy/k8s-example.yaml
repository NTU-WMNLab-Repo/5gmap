apiVersion: v1
kind: Service
metadata:
  name: __PROXY_NAME__
spec:
  selector:
    app: __PROXY_NAME__
  ports:
    - name: ngap-sctp
      protocol: SCTP
      port: __NGAP_PORT__
      targetPort: __NGAP_PORT__
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __PROXY_NAME__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __PROXY_NAME__
  template:
    metadata:
      labels:
        app: __PROXY_NAME__
    spec:
      containers:
        - name: proxy
          image: docker.io/genechen0203/ngap-sctp-proxy:latest
          imagePullPolicy: Always
          command:
            - python3
            - -u
            - proxies/ngap-sctp-proxy/ngap_sctp_proxy.py
          env:
            - name: AMF_HOST
              value: "__AMF_HOST__"
            - name: AMF_PORT
              value: "__NGAP_PORT__"
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: LISTEN_PORT
              value: "__NGAP_PORT__"
            - name: SCTP_PPID
              value: "60"
            - name: OTEL_SERVICE_NAME
              value: "__PROXY_NAME__"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "__OTEL_ENDPOINT__"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "__OTEL_INSECURE__"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_HEX_BYTES
              value: "32"
            - name: AMF_CONNECT_RETRIES
              value: "60"
            - name: AMF_CONNECT_RETRY_SECONDS
              value: "2"
            - name: TRACE_QUEUE_SIZE
              value: "10000"
            - name: ONLINE_CORRELATION_ENABLED
              value: "__ONLINE_CORRELATION_ENABLED__"
            - name: ONLINE_CORRELATION_ENDPOINT
              value: "__ONLINE_CORRELATION_ENDPOINT__"
            - name: ONLINE_CORRELATION_TIMEOUT_MS
              value: "100"
            - name: ONLINE_CORRELATION_FAIL_OPEN
              value: "1"
            - name: ONLINE_TRACE_BUFFER_MS
              value: "1000"
            - name: ONLINE_TRACE_BUFFER_MAX_EVENTS
              value: "256"
            - name: NGAP_ENABLE_CORRELATION
              value: "1"
            - name: NGAP_CORRELATION_MAX_CONTEXTS
              value: "10000"
            - name: NGAP_ENABLE_PYCRATE
              value: "1"
            - name: NGAP_PYCRATE_MODULE
              value: "pycrate_asn1dir.NGAP"
            - name: NGAP_PYCRATE_OBJECT
              value: "NGAP_PDU_Descriptions.NGAP_PDU"
            - name: ASN1_COPY_ROOT
              value: "0"
            - name: ASN1_INCLUDE_VALUE
              value: "0"
            - name: ASN1_VALUE_REPR_LIMIT
              value: "2048"
            - name: ASN1_INCLUDE_SHOW
              value: "0"
          ports:
            - containerPort: __NGAP_PORT__
              protocol: SCTP
          securityContext:
            privileged: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        deplocation: __RAN_LOC__
